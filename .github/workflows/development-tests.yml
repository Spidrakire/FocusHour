name: Development tests
on:
  push:
    branches:
      - registration/brevo-sync-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline unit tests
        run: node --test tests/*.test.mjs
